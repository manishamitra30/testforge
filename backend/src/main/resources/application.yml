spring:
  application:
    name: testforge
  profiles:
    # dev unless SPRING_PROFILES_ACTIVE says otherwise (set it to prod in production)
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true   # adds /actuator/health/liveness and /actuator/health/readiness

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

# Origins allowed to call the API from a browser (REST and WebSocket). Comma separated, no trailing slash.
app:
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:*}"
