server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Hashed build output can be cached for a long time.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # The entry point must always be re-checked so a new deploy is picked up.
    location = /index.html {
        expires -1;
    }

    # SPA fallback: /dashboard, /runs/12 and friends are routes inside the app, not files,
    # so a refresh on any of them must serve index.html instead of a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
